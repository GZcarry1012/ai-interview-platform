# 浏览器 E2E（手动触发）
#
# 上游遗留的 Playwright E2E 尚未适配本仓库新增的认证体系（未登录请求会 401 并
# 跳转登录页），在 push CI 中会挂起至 job 超时，因此拆分为手动触发。
# 适配认证（E2E 内先走 /api/auth/login 获取令牌）后可改回 push 触发。
#
# 运行方式：Actions 页面选择本工作流 → Run workflow；
# 或本地：cd frontend && pnpm exec playwright install --with-deps chromium && pnpm run test:e2e

name: Browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run batch upload E2E
        run: pnpm run test:e2e:batch-upload

      - name: Run voice interview WebSocket E2E
        run: pnpm run test:e2e:voice
